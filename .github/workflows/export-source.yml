name: Export source
on:
  push:
    paths:
      - '.github/workflows/export-source.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - uses: actions/upload-artifact@v4
        with:
          name: kimshop-assembled-source
          path: src/App.tsx
          retention-days: 1
