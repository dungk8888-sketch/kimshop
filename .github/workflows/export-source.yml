name: Export source
on:
  push:
    paths:
      - '.github/workflows/export-source.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble App
        run: node scripts/assemble-app.mjs
      - name: Show Flash Sale context
        run: |
          grep -n -B 12 -A 28 "FLASH SALE" src/App.tsx || true
          grep -n -B 12 -A 28 "flashSale" src/App.tsx || true
      - uses: actions/upload-artifact@v4
        with:
          name: kimshop-assembled-source
          path: src/App.tsx
          retention-days: 1
