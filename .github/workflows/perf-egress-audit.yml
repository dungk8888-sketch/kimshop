name: perf-egress-audit

on:
  push:
    branches:
      - perf-egress-test-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Assemble and build current app
        run: npm run build
      - name: Audit Supabase/network call sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          pats={
            'from_calls': r"supabase\.from\(",
            'select_star': r"\.select\(\s*['\"]\*['\"]",
            'auth_get_session': r"auth\.getSession\(",
            'auth_get_user': r"auth\.getUser\(",
            'auth_state_listener': r"onAuthStateChange\(",
            'realtime_channel': r"\.channel\(",
            'functions_invoke': r"functions\.invoke\(",
            'storage_calls': r"\.storage\.",
            'intervals': r"setInterval\(",
            'timeouts': r"setTimeout\(",
            'visibility_listeners': r"visibilitychange",
            'load_remote_data': r"loadRemoteData\(",
            'load_catalog_only': r"loadCatalogOnly\(",
            'load_orders_only': r"loadOrdersOnly\(",
            'load_product_relations': r"loadProductDetailRelations\(",
          }
          out=[]
          for name,pat in pats.items():
            rx=re.compile(pat)
            hits=[]
            for i,line in enumerate(lines,1):
              if rx.search(line):
                hits.append({'line':i,'text':line.strip()[:700]})
            out.append((name,hits))
          report=[]
          report.append(f'App.tsx bytes={len(s.encode())} lines={len(lines)}')
          for name,hits in out:
            report.append(f'\n## {name}: {len(hits)}')
            for h in hits:
              report.append(f"{h['line']}: {h['text']}")
          Path('egress-audit.txt').write_text('\n'.join(report),encoding='utf-8')
          Path('egress-audit.json').write_text(json.dumps({k:v for k,v in out},ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(report[:260]))
          PY
      - name: Upload assembled audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-egress-audit
          path: |
            src/App.tsx
            egress-audit.txt
            egress-audit.json
            dist
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
