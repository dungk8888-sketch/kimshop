name: diag-preview-runtime
on:
  push:
    branches: [perf-egress-test-20260915]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ygqqtudavuugrvpkhvdp.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_8B6gKD7mNeh8Ny8DtPXdrQ_trIgA2Rb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app
        run: npm install --no-audit --no-fund
      - name: Build current test branch
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Run local storefront egress test
        shell: bash
        run: |
          set -euo pipefail
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kimshop-vite.log 2>&1 & echo $! > /tmp/kimshop-vite.pid)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > ./storefront-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const report = {
            generatedAt: new Date().toISOString(),
            sourceProject: 'ygqqtudavuugrvpkhvdp',
            scenarios: [],
            errors: []
          };
          const writeReport = () => fs.writeFileSync('/tmp/egress-report.json', JSON.stringify(report, null, 2));
          const sanitize = (url) => url
            .replace(/apikey=[^&]+/g, 'apikey=REDACTED')
            .replace(/authorization=[^&]+/gi, 'authorization=REDACTED');
          const endpointName = (url) => {
            try {
              const u = new URL(url);
              const m = u.pathname.match(/\/rest\/v1\/([^/?]+)/);
              if (m) return `rest:${m[1]}`;
              const s = u.pathname.match(/\/storage\/v1\/([^/?]+)/);
              if (s) return `storage:${s[1]}`;
              const a = u.pathname.match(/\/auth\/v1\/([^/?]+)/);
              if (a) return `auth:${a[1]}`;
              return u.pathname;
            } catch { return 'unknown'; }
          };

          let browser;
          let failed = false;
          try {
            browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:900}});
            let sb = [];
            const errors = [];
            page.on('console', m => { if (m.type() === 'error') errors.push('console:' + m.text()); });
            page.on('pageerror', e => errors.push('page:' + e.message));
            page.on('requestfailed', r => {
              if (r.url().includes('supabase.co')) errors.push('request:' + (r.failure()?.errorText || 'failed') + ':' + sanitize(r.url()));
            });
            page.on('response', async r => {
              if (!r.url().includes('supabase.co')) return;
              let bytes = 0;
              try { bytes = (await r.body()).length; } catch {}
              sb.push({
                status: r.status(),
                bytes,
                method: r.request().method(),
                endpoint: endpointName(r.url()),
                url: sanitize(r.url())
              });
            });

            async function inspect(label) {
              await page.waitForTimeout(12000);
              const body = await page.locator('body').innerText();
              const cards = await page.locator('[data-reveal-verify]').count();
              const empty = body.includes('Không tìm thấy sản phẩm phù hợp');
              const heading = (body.match(/GỢI Ý HÔM NAY\s*\([^\n)]*\)/) || [])[0] || '';
              const totalBytes = sb.reduce((n, x) => n + x.bytes, 0);
              const byEndpoint = {};
              for (const x of sb) {
                const row = byEndpoint[x.endpoint] ||= {requests:0, bytes:0, statuses:{}};
                row.requests += 1;
                row.bytes += x.bytes;
                row.statuses[x.status] = (row.statuses[x.status] || 0) + 1;
              }
              const scenario = {
                label,
                heading,
                cards,
                empty,
                ok: !empty && cards > 0 && !!heading && sb.every(x => x.status >= 200 && x.status < 400),
                supabaseRequests: sb.length,
                supabaseBytes: totalBytes,
                supabaseMiB: Number((totalBytes / 1024 / 1024).toFixed(3)),
                byEndpoint,
                requests: sb,
                errors: [...errors]
              };
              report.scenarios.push(scenario);
              console.log(`${label}_HEADING`, heading);
              console.log(`${label}_CARDS`, cards);
              console.log(`${label}_EMPTY`, empty);
              console.log(`${label}_SUPABASE_REQUESTS`, sb.length);
              console.log(`${label}_SUPABASE_BYTES`, totalBytes);
              console.log(`${label}_SUPABASE_MIB`, scenario.supabaseMiB);
              for (const [name,row] of Object.entries(byEndpoint).sort((a,b)=>b[1].bytes-a[1].bytes)) {
                console.log(`${label}_ENDPOINT`, name, row.requests, row.bytes, JSON.stringify(row.statuses));
              }
              for (const x of sb) console.log(`${label}_SUPABASE`, x.status, x.bytes, x.method, x.url);
              writeReport();
              if (!scenario.ok) failed = true;
            }

            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded', timeout:120000});
            await inspect('FRESH');
            await page.screenshot({path:'/tmp/storefront-fresh.png', fullPage:true});

            await page.evaluate(async () => {
              const db = await new Promise((resolve,reject) => {
                const req = indexedDB.open('kimshop_local_v1',1);
                req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains('storefront')) req.result.createObjectStore('storefront'); };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });
              await new Promise((resolve,reject) => {
                const tx = db.transaction('storefront','readwrite');
                const st = tx.objectStore('storefront');
                const empty = {savedAt:Date.now(),products:[],total:0,hasMore:false};
                st.put(empty,'default-home');
                st.put(empty,'default-home-v6');
                st.put(empty,'query:all::popular');
                st.put(empty,'query:v6:all::popular');
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
              });
              db.close();
            });
            sb = [];
            errors.length = 0;
            await page.reload({waitUntil:'domcontentloaded', timeout:120000});
            await inspect('EMPTY_CACHE_RECOVERY');
            await page.screenshot({path:'/tmp/storefront-empty-cache-recovery.png', fullPage:true});
          } catch (e) {
            failed = true;
            report.errors.push(e?.stack || String(e));
            console.error('DIAG_FATAL', e);
          } finally {
            writeReport();
            if (browser) await browser.close();
          }
          if (failed) process.exitCode = 1;
          EOF
          node ./storefront-smoke.mjs 2>&1 | tee /tmp/storefront-smoke.txt
          rm -f ./storefront-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-runtime-diag
          path: |
            /tmp/egress-report.json
            /tmp/storefront-smoke.txt
            /tmp/storefront-fresh.png
            /tmp/storefront-empty-cache-recovery.png
            /tmp/kimshop-vite.log
