name: diag-preview-runtime
on:
  push:
    branches: [perf-egress-test-20260915]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ygqqtudavuugrvpkhvdp.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_8B6gKD7mNeh8Ny8DtPXdrQ_trIgA2Rb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app
        run: npm install --no-audit --no-fund
      - name: Build current test branch
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Run local storefront smoke test
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kimshop-vite.log 2>&1 & echo $! > /tmp/kimshop-vite.pid)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cat > /tmp/storefront-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          let sb=[];
          const errors=[];
          page.on('console',m=>{ if(m.type()==='error') errors.push('console:'+m.text()); });
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('requestfailed',r=>{ if(r.url().includes('supabase.co')) errors.push('request:'+r.failure()?.errorText+':'+r.url()); });
          page.on('response',async r=>{
            if(!r.url().includes('supabase.co')) return;
            let bytes=0; try{ bytes=(await r.body()).length; }catch{}
            sb.push({status:r.status(),bytes,method:r.request().method(),url:r.url()});
          });
          async function inspect(label){
            await page.waitForTimeout(12000);
            const body=await page.locator('body').innerText();
            const cards=await page.locator('[data-reveal-verify]').count();
            const empty=body.includes('Không tìm thấy sản phẩm phù hợp');
            const heading=(body.match(/GỢI Ý HÔM NAY\s*\([^\n)]*\)/)||[])[0]||'';
            const totalBytes=sb.reduce((n,x)=>n+x.bytes,0);
            console.log(label+'_HEADING',heading);
            console.log(label+'_CARDS',cards);
            console.log(label+'_EMPTY',empty);
            console.log(label+'_SUPABASE_REQUESTS',sb.length);
            console.log(label+'_SUPABASE_BYTES',totalBytes);
            for(const x of sb) console.log(label+'_SUPABASE',x.status,x.bytes,x.method,x.url.replace(/apikey=[^&]+/g,'apikey=REDACTED'));
            if(empty || cards===0 || !heading) throw new Error(label+' storefront empty');
          }

          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});
          await inspect('FRESH');
          await page.screenshot({path:'/tmp/storefront-fresh.png',fullPage:true});

          // Reproduce the browser state that previously showed GỢI Ý HÔM NAY (0):
          // both legacy and current keys contain an empty cached product array.
          await page.evaluate(async()=>{
            const db=await new Promise((resolve,reject)=>{
              const req=indexedDB.open('kimshop_local_v1',1);
              req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains('storefront')) req.result.createObjectStore('storefront'); };
              req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
            });
            await new Promise((resolve,reject)=>{
              const tx=db.transaction('storefront','readwrite');
              const st=tx.objectStore('storefront');
              const empty={savedAt:Date.now(),products:[],total:0,hasMore:false};
              st.put(empty,'default-home');
              st.put(empty,'default-home-v6');
              st.put(empty,'query:all::popular');
              st.put(empty,'query:v6:all::popular');
              tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
            });
            db.close();
          });
          sb=[];
          await page.reload({waitUntil:'domcontentloaded',timeout:120000});
          await inspect('EMPTY_CACHE_RECOVERY');
          await page.screenshot({path:'/tmp/storefront-empty-cache-recovery.png',fullPage:true});

          for(const e of errors) console.log('ERROR',e);
          await browser.close();
          EOF
          node /tmp/storefront-smoke.mjs | tee /tmp/storefront-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-runtime-diag
          path: |
            /tmp/storefront-smoke.txt
            /tmp/storefront-fresh.png
            /tmp/storefront-empty-cache-recovery.png
            /tmp/kimshop-vite.log
