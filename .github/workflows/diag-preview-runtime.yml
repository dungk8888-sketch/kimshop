name: diag-preview-runtime
on:
  push:
    branches: [perf-egress-test-20260915]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright only
        run: |
          mkdir -p /tmp/diagpkg
          cd /tmp/diagpkg
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Inspect preview in Chromium
        working-directory: /tmp/diagpkg
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url='https://kimshop-git-perf-egress-test-20260915-dungk8888-6492.vercel.app/?_vercel_share=eQEW7PwdTqmGk0eB9PczWgZJdlIyLPi1';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',e.message));
          page.on('requestfailed',r=>{ if(r.url().includes('supabase.co')) console.log('SUPABASE_FAIL',r.failure()?.errorText,r.url()); });
          page.on('response',async r=>{
            if(r.url().includes('supabase.co')){
              let len=''; try{len=(await r.body()).length}catch{}
              console.log('SUPABASE',r.status(),len,r.request().method(),r.url());
            }
          });
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(12000);
          console.log('TITLE',await page.title());
          console.log('BODY', (await page.locator('body').innerText()).slice(0,3000));
          await page.screenshot({path:'preview-diag.png',fullPage:true});
          await browser.close();
          EOF
          node diag.mjs | tee preview-diag.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-runtime-diag
          path: |
            /tmp/diagpkg/preview-diag.txt
            /tmp/diagpkg/preview-diag.png
